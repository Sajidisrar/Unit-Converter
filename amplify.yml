version: 1
applications:
  - appRoot: .
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 20 || true
            - nvm use 20 || true
            - corepack enable || true
            - npm ci
        build:
          commands:
            # Construct Amplify preview URL so next-sitemap gets a valid SITE_URL
            - export SITE_URL="https://${AMPLIFY_BRANCH}.${AMPLIFY_APP_ID}.amplifyapp.com"
            - echo "Using SITE_URL=$SITE_URL"
            - npm run build
      artifacts:
        # Amplify Next.js SSR ignores artifacts for serving, but keeping for completeness
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*

